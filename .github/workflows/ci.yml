name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 20 * * *"  # 03:17 ICT nightly full suite
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A PR push cancels its stale run. Main runs queue (one running, one pending)
  # so the full suite is not cancelled before it can report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

# Jobs run on the cheese-work X99 runner pool (ephemeral org runners labelled
# cheese-x99), per Cheese's 2026-10-21 directive. The pool refuses fork pull
# requests in its job-started hook; the job-level `if` skips them first.

jobs:
  # Windows leg removed org-wide per CHE-522 (Cheese: Linux CI only, no
  # Windows jobs or artifacts).
  # Full Python suite: main, nightly and manual runs only (CHE-3276). A PR takes
  # the fast lane in `python-quality`. The suite takes 70+ min on X99, so no
  # sharding fits the PR rule (at most 2 runners, no more runner-minutes).
  python-tests:
    name: Python 3.12 (${{ matrix.suite }})
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'upstream-sync/') && github.event_name != 'pull_request' }}
    runs-on: ${{ github.repository_owner == 'cheese-work' && fromJSON('["self-hosted","Linux","X64","cheese-x99"]') || fromJSON('["ubuntu-latest"]') }}
    # Each matrix leg gets its own budget. The deterministic suite grew from ~21 to
    # ~42 min between 28 and 29 Oct and swings up to 2.6x under shared-runner load.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # One X99 runner per run: CHE-2461 (PR #244) split the legs and kept them
      # serial so a run adds no extra contention on the shared 3-CPU host.
      max-parallel: 1
      matrix:
        suite: [deterministic, reverse]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install system libraries for OpenCV
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libgl1 libglib2.0-0 libxcb1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check runner routing
        run: python .github/tests/test_runner_routing.py

      - name: Check public dependency sources before installation
        run: python scripts/check_dependency_sources.py

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --dev --locked

      - name: Check Python formatting
        if: matrix.suite == 'deterministic'
        run: uv run ruff format --check .

      - name: Lint Python
        if: matrix.suite == 'deterministic'
        run: uv run ruff check .

      - name: Enforce quality ratchets
        if: matrix.suite == 'deterministic'
        run: uv run python scripts/quality_ratchet.py

      - name: Type-check protected core modules
        if: matrix.suite == 'deterministic'
        run: uv run pyright --project pyright-core.json

      # Device, cloud, manual, and end-to-end suites require dedicated
      # infrastructure and intentionally do not run on GitHub-hosted runners.
      - name: Fetch CHE-844 receipt sources
        run: |
          git fetch --no-tags --depth=1 origin \
            feefd94c72dbce0fa1afc109ffe3d8254f565d6b \
            096411113522abc37964256833fecbbac4778af4
          git cat-file -e feefd94c72dbce0fa1afc109ffe3d8254f565d6b^{commit}
          git cat-file -e 096411113522abc37964256833fecbbac4778af4^{commit}

      - name: Run deterministic Python tests
        if: matrix.suite == 'deterministic'
        run: >-
          uv run pytest
          tests/unit
          tests/tools
          packages/artemis-client/tests
          -q
          --durations=20
          --cov=artemis
          --cov=mcp_server
          --cov=apps/admin_console
          --cov=third_party
          --cov-fail-under=60
          -rfE
          --junitxml=test-reports/junit-deterministic.xml

      - name: Run unit tests in reverse file order
        if: matrix.suite == 'reverse'
        shell: bash
        run: |
          mapfile -d '' -t test_files < <(find tests/unit -type f \( -name 'test_*.py' -o -name '*_test.py' -o -name '*.test.py' \) -print0 | LC_ALL=C sort -zr)
          uv run pytest "${test_files[@]}" -q --durations=20 -rfE --junitxml=test-reports/junit-reverse.xml

      - name: Enforce B2 ADB allowlist and tunnel fuzz merge gate
        if: matrix.suite == 'deterministic'
        run: >-
          uv run pytest tests/unit/runtime/test_host_tunnel.py
          tests/unit/admin_console/test_host_tunnel_service.py -q

      # Job logs of long X99 Python jobs came back 404 (CHE-2621): keep the
      # failing test names in an artifact as well.
      - name: Upload test report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.suite }}
          path: test-reports/*.xml
          if-no-files-found: warn
          retention-days: 7

  # PR fast lane (CHE-3276): the required `Python 3.12` check. Lint, types and
  # the unit tests outside tests/unit/admin_console (about 75% of the suite
  # time) report within 15 min. The coverage floor and the reverse-order pass
  # run in `python-tests` on main and nightly.
  python-quality:
    name: Python 3.12
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'upstream-sync/') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner == 'cheese-work' && fromJSON('["self-hosted","Linux","X64","cheese-x99"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system libraries for OpenCV
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libgl1 libglib2.0-0 libxcb1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check runner routing
        run: python .github/tests/test_runner_routing.py

      - name: Check public dependency sources before installation
        run: python scripts/check_dependency_sources.py

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --dev --locked

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Enforce quality ratchets
        run: uv run python scripts/quality_ratchet.py

      - name: Type-check protected core modules
        run: uv run pyright --project pyright-core.json

      - name: Fetch CHE-844 receipt sources
        run: |
          git fetch --no-tags --depth=1 origin \
            feefd94c72dbce0fa1afc109ffe3d8254f565d6b \
            096411113522abc37964256833fecbbac4778af4
          git cat-file -e feefd94c72dbce0fa1afc109ffe3d8254f565d6b^{commit}
          git cat-file -e 096411113522abc37964256833fecbbac4778af4^{commit}

      - name: Run fast Python tests
        run: >-
          uv run pytest
          tests/unit
          tests/tools
          packages/artemis-client/tests
          --ignore=tests/unit/admin_console
          -q
          --durations=20

      # tests/unit/admin_console is skipped above; run the part the PR touches.
      # Fail closed: a git or selector error stops the job. Only an empty
      # selection passes without running tests.
      - name: Run admin_console tests mapped from the changed paths
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff --name-only FETCH_HEAD HEAD > "$RUNNER_TEMP/changed.txt"
          python scripts/ci_mapped_tests.py < "$RUNNER_TEMP/changed.txt" > "$RUNNER_TEMP/mapped.txt"
          mapfile -t tests < <(grep . "$RUNNER_TEMP/mapped.txt" || true)
          if [ "${#tests[@]}" -eq 0 ]; then echo "No admin_console tests map to this change"; exit 0; fi
          printf 'Mapped test: %s\n' "${tests[@]}"
          uv run pytest "${tests[@]}" -q --durations=20

  # The B2 ADB allowlist and tunnel fuzz merge gate is its own check so a branch
  # rule can require it by name (CHE-3276, eng review D15 = A). It was a step of
  # the full-suite job before. The full suite still runs it on main.
  b2-gate:
    name: B2 ADB allowlist and tunnel fuzz
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'upstream-sync/') && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner == 'cheese-work' && fromJSON('["self-hosted","Linux","X64","cheese-x99"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install system libraries for OpenCV
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libgl1 libglib2.0-0 libxcb1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --dev --locked

      - name: Enforce B2 ADB allowlist and tunnel fuzz merge gate
        run: >-
          uv run pytest tests/unit/runtime/test_host_tunnel.py
          tests/unit/admin_console/test_host_tunnel_service.py -q

  frontend:
    name: Frontend tests and production build
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'upstream-sync/') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ github.repository_owner == 'cheese-work' && fromJSON('["self-hosted","Linux","X64","cheese-x99","cheese-x99-browser"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/showcase_ui

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/showcase_ui/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Set up headless Chrome
        id: chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Export Chrome path
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: printf 'CHROME_BIN=%s\n' "$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Run frontend tests at 800 px and 1440 px
        run: npm test -- --watch=false --browsers=ChromeHeadlessNarrow,ChromeHeadlessWide

      - name: Build frontend for production
        run: npm run build

      - name: Build frontend from Docker stage inputs
        run: npm run test:docker-build-inputs

      # The check drives the real Angular UI in headless Chrome and needs the
      # development build (production builds strip the `ng` debug API).
      - name: Build development UI for the preview-path check
        run: npm run build -- --configuration development

      - name: Check responsive shell teardown and 44 px controls
        run: npm run test:shell-cleanup

      - name: Check root and /preview/pr/70/ browser requests
        run: |
          "$CHROME_BIN" --version
          npm run test:preview-path

  package:
    name: Build and smoke-test Python packages
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'upstream-sync/') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ github.repository_owner == 'cheese-work' && fromJSON('["self-hosted","Linux","X64","cheese-x99"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system libraries for OpenCV
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libgl1 libglib2.0-0 libxcb1

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/showcase_ui/package-lock.json

      - name: Build frontend assets for the wheel
        run: |
          npm ci --prefix apps/showcase_ui
          npm run build --prefix apps/showcase_ui

      - name: Build client and Artemis distributions
        run: |
          uv build --package artemis-client --wheel --out-dir dist
          uv build --package artemis --wheel --sdist --out-dir dist

      - name: Install wheels in a clean environment
        run: |
          uv venv .smoke-venv --python 3.12
          uv pip install --python .smoke-venv/bin/python dist/artemis_client-*.whl dist/artemis-*.whl

      - name: Smoke-test installed package and CLI
        shell: bash
        run: |
          smoke_dir="$RUNNER_TEMP/artemis-wheel-smoke"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          source "$GITHUB_WORKSPACE/.smoke-venv/bin/activate"
          python - <<'PY'
          from importlib.metadata import files, version

          import artemis
          from artemis.resources import get_bundled_config_path, get_bundled_showcase_dist

          bundled_config = get_bundled_config_path("artemis.jsonc")
          bundled_ui = get_bundled_showcase_dist()
          assert artemis.__version__ == version("artemis")
          assert bundled_config is not None and bundled_config.is_file()
          assert bundled_ui is not None and (bundled_ui / "index.html").is_file()
          assert not any("node_modules" in str(path) for path in (files("artemis") or ()))
          from apps.admin_console.core.preview_demo import CLIP

          assert CLIP.is_file(), CLIP
          print(f"Installed Artemis {artemis.__version__} with bundled runtime resources")
          PY
          artemis --version
          artemis --help

      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7
