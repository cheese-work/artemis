name: Host agent core

on:
  workflow_dispatch:
  push:
    paths:
      - 'host-agent/**'
      - 'artemis/runtime/adb_gateway.py'
      - 'artemis/runtime/host_*.py'
      - 'tests/unit/runtime/test_host*.py'
      - 'tests/support/fake_adb.py'
      - '.github/workflows/host-agent.yml'
  pull_request:
    paths:
      - 'host-agent/**'
      - 'artemis/runtime/adb_gateway.py'
      - 'artemis/runtime/host_*.py'
      - 'tests/unit/runtime/test_host*.py'
      - 'tests/support/fake_adb.py'
      - '.github/workflows/host-agent.yml'

permissions:
  contents: read

concurrency:
  group: host-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'upstream-sync/') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, cheese-x99]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: host-agent
    steps:
      - uses: actions/checkout@v4
      - name: Use disposable build caches
        shell: bash
        run: |
          set -euo pipefail
          cache_filesystem=$(df -P "${RUNNER_TEMP:?}" | awk 'NR == 2 {print $1}')
          if [[ -z "$cache_filesystem" || "$cache_filesystem" == /dev/nvme1n1* || "$RUNNER_TEMP" == /mnt/ssd2/* ]]; then
            echo "::error::ssd2 or unknown cache filesystem: $cache_filesystem. CHE-2557 must move this runner lane to root-disk storage." >&2
            exit 1
          fi
          printf '%s\n' \
            "GOCACHE=$RUNNER_TEMP/build-cache/go-build" \
            "GOPATH=$RUNNER_TEMP/build-cache/go" \
            "GOMODCACHE=$RUNNER_TEMP/build-cache/go/pkg/mod" \
            "GOFLAGS=${GOFLAGS:+$GOFLAGS }-modcacherw" \
            "XDG_CACHE_HOME=$RUNNER_TEMP/build-cache/xdg" \
            "XDG_DATA_HOME=$RUNNER_TEMP/build-cache/data" \
            "npm_config_cache=$RUNNER_TEMP/build-cache/npm" \
            "npm_config_store_dir=$RUNNER_TEMP/build-cache/pnpm" \
            "PIP_CACHE_DIR=$RUNNER_TEMP/build-cache/pip" \
            "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/build-cache/pycache" \
            "UV_CACHE_DIR=$RUNNER_TEMP/build-cache/uv" \
            "BUILDX_CONFIG=$RUNNER_TEMP/build-cache/buildx" \
            >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: true
          cache-dependency-path: host-agent/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: sh -n build.sh install.sh
      - run: sh build.sh "${{ github.sha }}"
      - run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: smartqa-host-core
          path: host-agent/dist/
  gateway:
    if: ${{ !startsWith(github.head_ref || github.ref_name, 'upstream-sync/') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, cheese-x99]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Use disposable build caches
        shell: bash
        run: |
          set -euo pipefail
          cache_filesystem=$(df -P "${RUNNER_TEMP:?}" | awk 'NR == 2 {print $1}')
          if [[ -z "$cache_filesystem" || "$cache_filesystem" == /dev/nvme1n1* || "$RUNNER_TEMP" == /mnt/ssd2/* ]]; then
            echo "::error::ssd2 or unknown cache filesystem: $cache_filesystem. CHE-2557 must move this runner lane to root-disk storage." >&2
            exit 1
          fi
          printf '%s\n' \
            "GOCACHE=$RUNNER_TEMP/build-cache/go-build" \
            "GOPATH=$RUNNER_TEMP/build-cache/go" \
            "GOMODCACHE=$RUNNER_TEMP/build-cache/go/pkg/mod" \
            "GOFLAGS=${GOFLAGS:+$GOFLAGS }-modcacherw" \
            "XDG_CACHE_HOME=$RUNNER_TEMP/build-cache/xdg" \
            "XDG_DATA_HOME=$RUNNER_TEMP/build-cache/data" \
            "npm_config_cache=$RUNNER_TEMP/build-cache/npm" \
            "npm_config_store_dir=$RUNNER_TEMP/build-cache/pnpm" \
            "PIP_CACHE_DIR=$RUNNER_TEMP/build-cache/pip" \
            "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/build-cache/pycache" \
            "UV_CACHE_DIR=$RUNNER_TEMP/build-cache/uv" \
            "BUILDX_CONFIG=$RUNNER_TEMP/build-cache/buildx" \
            >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_dependency_sources.py
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgl1 libglib2.0-0 libxcb1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          enable-cache: true
          cache-local-path: ${{ runner.temp }}/build-cache/uv
          cache-dependency-glob: uv.lock
      - run: uv sync --dev --locked
      - run: uv run pytest tests/unit/runtime/test_host_tunnel.py tests/unit/admin_console/test_host_tunnel_service.py tests/unit/runtime/test_fake_adb_lifecycle.py tests/unit/runtime/test_fake_adb_seam.py -q
