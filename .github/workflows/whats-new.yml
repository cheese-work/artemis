name: What's New

# Separate from CI so adding or removing the no-whats-new label re-runs only
# this check.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  entry:
    name: What's New entry
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ github.repository_owner == 'cheese-work' && fromJSON('["self-hosted","Linux","X64","cheese-x99"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use disposable build caches
        shell: bash
        run: |
          set -euo pipefail
          cache_filesystem=$(df -P "${RUNNER_TEMP:?}" | awk 'NR == 2 {print $1}')
          if [[ -z "$cache_filesystem" || "$cache_filesystem" == /dev/nvme1n1* || "$RUNNER_TEMP" == /mnt/ssd2/* ]]; then
            echo "::error::ssd2 or unknown cache filesystem: $cache_filesystem. CHE-2557 must move this runner lane to root-disk storage." >&2
            exit 1
          fi
          printf '%s\n' \
            "GOCACHE=$RUNNER_TEMP/build-cache/go-build" \
            "GOPATH=$RUNNER_TEMP/build-cache/go" \
            "GOMODCACHE=$RUNNER_TEMP/build-cache/go/pkg/mod" \
            "GOFLAGS=${GOFLAGS:+$GOFLAGS }-modcacherw" \
            "XDG_CACHE_HOME=$RUNNER_TEMP/build-cache/xdg" \
            "XDG_DATA_HOME=$RUNNER_TEMP/build-cache/data" \
            "npm_config_cache=$RUNNER_TEMP/build-cache/npm" \
            "npm_config_store_dir=$RUNNER_TEMP/build-cache/pnpm" \
            "PIP_CACHE_DIR=$RUNNER_TEMP/build-cache/pip" \
            "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/build-cache/pycache" \
            "UV_CACHE_DIR=$RUNNER_TEMP/build-cache/uv" \
            "BUILDX_CONFIG=$RUNNER_TEMP/build-cache/buildx" \
            >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"

      - name: Require a What's New entry for SmartQA UI changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node apps/showcase_ui/scripts/check-whats-new-entry.mjs "$BASE_SHA" "$HEAD_SHA"
