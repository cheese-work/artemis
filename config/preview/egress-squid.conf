http_port 127.0.0.1:3128
hosts_file /run/artemis-preview/egress.hosts
dns_nameservers 127.0.0.1
dns_multicast_local off
cache deny all
forwarded_for delete

acl preview_connect method CONNECT
acl preview_https port 443
acl preview_registry dstdomain -n registry.npmjs.org pypi.org files.pythonhosted.org
acl preview_denied_ipv4 dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl preview_denied_ipv6 dst 2001::/23 2001:db8::/32 2002::/16 3fff::/20 ::1/128 64:ff9b::/96 64:ff9b:1::/48 100::/64 fc00::/7 fe80::/10 fec0::/10 ff00::/8
acl preview_resolved dst ipv4 2000::/3

http_access deny !preview_connect
http_access deny !preview_https
http_access deny !preview_registry
http_access deny preview_denied_ipv4
http_access deny preview_denied_ipv6
http_access allow preview_resolved
http_access deny all
